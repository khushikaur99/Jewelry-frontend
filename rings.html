<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8; /* Fallback background */
        }

        .coming-soon {
            height: 100%;
            background: 
                /* Your image */
                url('./IMAGES/RINGS\ BANNER.png') no-repeat center center;
            background-size: contain;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
            position: relative; /* Needed for absolute positioning of arrow */
        }

        .content {
            max-width: 800px;
            background-color: rgba(0,0,0,0.5); /* Semi-transparent background for text */
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* === Back Arrow === */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 1.5rem;
            background-color: #A91E4A;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .back-arrow:hover {
            background-color: #A91E4A;
            transform: translateX(-3px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            p {
                font-size: 1.2rem;
            }
            .coming-soon {
                background-size: cover;
            }
        }

        @media (max-width: 480px) {
            .back-arrow {
                width: 35px;
                height: 35px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="coming-soon">
        <a href="javascript:history.back()" class="back-arrow" aria-label="Go back">←</a>
       
    </div>
</body>
</html>
